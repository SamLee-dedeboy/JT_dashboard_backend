# fly.toml app configuration file generated for jt-dashboard-backend on 2025-10-27T06:19:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jt-dashboard-backend'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
